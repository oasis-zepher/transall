name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.lock coverage ruff bandit pip-audit
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run tests with coverage
        run: coverage run -m unittest discover -s tests -v && coverage report -m
      - name: Run static and security checks
        run: |
          ruff check app tests
          bandit -q -r app
          pip-audit -r requirements.lock

  native-macos:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    defaults:
      run:
        working-directory: native/TransallMac
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Lint Swift formatting
        run: xcrun swift-format lint --strict --recursive --parallel Sources Tests
      - name: Validate release metadata
        run: scripts/validate_release_metadata.sh
      - name: Run strict Swift package tests
        run: >-
          swift test
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors
      - name: Run Xcode scheme tests
        run: >-
          xcodebuild
          -project Transall.xcodeproj
          -scheme Transall
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/TransallTests"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          SWIFT_STRICT_CONCURRENCY=complete
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          test
      - name: Run Xcode static analyzer
        run: >-
          xcodebuild
          -project Transall.xcodeproj
          -scheme Transall
          -configuration Release
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/TransallAnalyze"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          SWIFT_STRICT_CONCURRENCY=complete
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          analyze

  support-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: store/support-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: store/support-site/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Run lint
        run: npm run lint
      - name: Build and test rendered pages
        run: npm test
