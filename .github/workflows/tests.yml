name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run tests with coverage
        run: coverage run -m unittest discover -s tests -v && coverage report -m
      - name: Run static and security checks
        run: |
          ruff check app tests
          bandit -q -r app
          pip-audit --disable-pip --vulnerability-service osv --progress-spinner off --timeout 30 -r requirements.lock

  native-macos:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    defaults:
      run:
        working-directory: native/TransallMac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install pinned XcodeGen
        run: scripts/install_pinned_xcodegen.sh "$RUNNER_TEMP/xcodegen" >> "$GITHUB_PATH"
      - name: Verify generated Xcode project
        run: scripts/verify_xcodegen_project.sh
      - name: Lint Swift formatting
        run: xcrun swift-format lint --strict --recursive --parallel Sources Tests
      - name: Validate release metadata
        run: scripts/validate_release_metadata.sh
      - name: Test release metadata validator
        run: scripts/test_release_metadata_validator.sh
      - name: Run strict Swift package tests
        run: >-
          swift test
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors
      - name: Run Xcode scheme tests
        run: >-
          xcodebuild
          -project Transall.xcodeproj
          -scheme Transall
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/TransallTests"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          SWIFT_STRICT_CONCURRENCY=complete
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          test
      - name: Run Xcode static analyzer
        run: >-
          xcodebuild
          -project Transall.xcodeproj
          -scheme Transall
          -configuration Release
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/TransallAnalyze"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          SWIFT_STRICT_CONCURRENCY=complete
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          analyze

  support-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: store/support-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: store/support-site/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Run lint
        run: npm run lint
      - name: Build and test rendered pages
        run: npm test
