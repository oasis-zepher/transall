name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Core runtime only: engine adapters (playwright, markitdown, BabelDOC,
      # OCRmyPDF) are mocked in tests and not needed to run the suite.
      - name: Install dependencies
        run: python -m pip install fastapi "uvicorn[standard]" python-multipart PyMuPDF Pillow pytesseract httpx Markdown
      - name: Run tests
        run: python -m unittest discover -s tests -v
