name: Transall
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Transall:
    type: application
    platform: macOS
    sources:
      - path: Sources/TransallMac
      - path: Resources
        buildPhase: resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Transall
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.transall.mac
        PRODUCT_NAME: Transall
        PRODUCT_MODULE_NAME: TransallMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        INFOPLIST_FILE: Support/Info.plist
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Support/Transall.Debug.entitlements
          ENABLE_APP_SANDBOX: YES
        Release:
          CODE_SIGN_ENTITLEMENTS: Support/Transall.entitlements
          ENABLE_APP_SANDBOX: YES
  TransallTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TransallMacTests
    dependencies:
      - target: Transall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.transall.mac.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Transall:
    build:
      targets:
        Transall: all
        TransallTests: [test]
    test:
      targets:
        - TransallTests
    run:
      config: Debug
    archive:
      config: Release
